    "fastapi>=0.165.0",
    "flashrank>=0.2.10",
    "google-generativeai>=0.8.6",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-google-vertexai>=3.3.0",
    "langchain-groq>=1.2.1",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.8.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.23",
    "langsmith>=0.15.0",
    "logfire[fastapi,requests]>=5.6.0",
    "loguru>=0.7.3",
    "nemoguardrails>=0.23.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.6",
    "pdfplumber>=0.11.10",
    "portkey-ai>=2.3.4",
    "pydantic>=2.0.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "pytz>=2026.6",
    "qdrant-client>=1.20.0",
    "ragas>=0.3.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "unstructured>=0.27.37",
    "uvicorn[standard]>=0.54.0",
